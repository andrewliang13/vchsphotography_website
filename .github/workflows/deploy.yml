name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static assets
        run: |
          mkdir -p dist/team dist/assets
          cp index.html _headers dist/
          cp assets/portfolio.css dist/assets/
          cp team/*.html dist/team/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=vchsphotography-website --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
