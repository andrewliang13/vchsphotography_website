  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
  <script>
    gsap.registerPlugin(ScrollTrigger);
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!reduceMotion) {
      gsap.from('.portfolio-hero > *', { opacity: 0, y: 18, duration: .7, stagger: .08, ease: 'power3.out' });
      gsap.utils.toArray('.gallery-item').forEach((el, i) => {
        gsap.from(el, {
          opacity: 0, y: 24, duration: .75, delay: Math.min(i * .03, .4), ease: 'power3.out',
          scrollTrigger: { trigger: el, start: 'top 92%', once: true }
        });
      });
    }

    const filters = document.querySelectorAll('.portfolio-filter');
    const sections = document.querySelectorAll('[data-category-section]');
    filters.forEach(btn => {
      btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;
        filters.forEach(b => b.classList.toggle('is-active', b === btn));
        sections.forEach(section => {
          const show = filter === 'all' || section.dataset.categorySection === filter;
          section.hidden = !show;
        });
        if (window.ScrollTrigger) ScrollTrigger.refresh();
      });
    });
  </script>
